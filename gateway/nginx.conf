worker_processes auto;
events {
    worker_connections 4096;
    multi_accept on;
}
http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream auth { server auth-service:3000; }
    upstream analytics { server analytics-service:3001; }
    upstream crawler { server crawler-service:8000; }
    upstream search { server search-service:8000; }
    upstream indexer { server indexer-service:8000; }

    server {
        listen 80;

        location /auth/ {
            include cors.conf;
            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /analytics/ {
            include cors.conf;
            proxy_pass http://analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /crawl/ {
            include cors.conf;
            proxy_pass http://crawler/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /search {
            include cors.conf;
            proxy_pass http://search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /index/ {
            include cors.conf;
            proxy_pass http://indexer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /health {
            include cors.conf;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }
    }
}
